name: Aktien-Radar

on:
  schedule:
    - cron: "0 6 * * 1"   # jeden Montag 06:00 UTC (07:00/08:00 Uhr deutscher Zeit)
  workflow_dispatch:       # manueller Start über den Knopf "Run workflow"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Radar berechnen
        run: python aktien_radar.py
      - name: Seite zusammenstellen
        run: |
          mkdir site
          cp aktien_radar.html site/index.html
          cp aktien_radar.csv site/aktien_radar.csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
